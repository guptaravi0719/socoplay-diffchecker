<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Compare text, code, and documents instantly with SocoPlay.tools Diff Checker. Private, free, and runs in your browser." />
    <title>Diff Checker — Compare text online | SocoPlay.tools</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="diff-page">
    <header class="site-header">
      <a class="brand" href="/" aria-label="SocoPlay.tools home"><span class="brand-mark">S</span><span>SocoPlay<span>.tools</span></span></a>
      <nav aria-label="Primary navigation"><a class="active" href="/diff-checker/">Diff Checker</a><a href="/#coming-soon">More tools</a></nav>
      <a class="games-link" href="https://socoplay.com">Play games <span aria-hidden="true">↗</span></a>
    </header>

    <main class="tool-shell simple-tool-shell">
      <div class="tool-titlebar">
        <div><h1>Compare changes</h1><p>Paste two versions to see what changed.</p></div>
        <div class="options">
          <label><input id="ignore-space" type="checkbox" /> Ignore spaces</label>
          <label><input id="ignore-case" type="checkbox" /> Ignore case</label>
        </div>
      </div>

      <section id="workspace" class="workspace simple-workspace" aria-label="Diff checker workspace">
        <div id="editor-stage" class="editor-stage">
          <div class="editors" id="editors">
            <article class="editor-card editor-before">
              <div class="editor-head"><span><i></i> Original text</span><button class="text-button clear-editor" data-target="before" type="button">Clear</button></div>
              <textarea id="before-text" aria-label="Original text" spellcheck="false" placeholder="Paste the original text here…"></textarea>
              <div class="editor-foot"><span id="before-count">0 characters</span><button class="text-button example-button" data-target="before" type="button">Try example</button></div>
            </article>
            <button class="swap-button" id="swap" type="button" aria-label="Swap original and revised text" title="Swap texts">⇄</button>
            <article class="editor-card editor-after">
              <div class="editor-head"><span><i></i> Changed text</span><button class="text-button clear-editor" data-target="after" type="button">Clear</button></div>
              <textarea id="after-text" aria-label="Changed text" spellcheck="false" placeholder="Paste the changed text here…"></textarea>
              <div class="editor-foot"><span id="after-count">0 characters</span><button class="text-button example-button" data-target="after" type="button">Try example</button></div>
            </article>
          </div>

          <div class="compare-row">
            <button class="secondary-button" id="clear-all" type="button">Clear all</button>
            <button class="primary-button" id="compare" type="button">Compare changes</button>
            <p id="input-message" class="input-message" aria-live="polite"></p>
          </div>
        </div>

        <section id="result-section" class="result-section comparison-stage" hidden aria-live="polite">
          <aside class="diff-sidebar" aria-label="Diff display tools">
            <div class="side-tabs"><button type="button" class="side-tab is-selected">Tools</button><button type="button" class="side-tab" disabled>History</button></div>
            <section class="side-section">
              <p>Layout</p>
              <div class="segmented"><button type="button" class="is-selected">Split</button><button type="button" disabled>Unified</button></div>
            </section>
            <section class="side-section controls">
              <label><span>Hide unchanged lines</span><input id="hide-unchanged" type="checkbox" /></label>
              <label><span>Disable line wrap</span><input id="disable-wrap" type="checkbox" /></label>
              <label><span>Ignore spaces</span><input id="result-ignore-space" type="checkbox" /></label>
              <label><span>Ignore case</span><input id="result-ignore-case" type="checkbox" /></label>
            </section>
            <div class="side-actions">
              <button id="first-change" type="button">◎ Go to first change</button>
              <button id="new-comparison" type="button">✎ Edit input</button>
            </div>
          </aside>
          <div class="diff-review">
            <div class="result-head">
              <div><h2>Untitled comparison</h2><div id="summary" class="summary" aria-label="Comparison summary"></div></div>
              <div class="result-actions"><button class="secondary-button" id="copy-result" type="button">Copy summary</button></div>
            </div>
            <div class="diff-column-headings"><span>Original text</span><span>Changed text</span></div>
            <div class="legend"><span><b class="removed-dot"></b> Removed</span><span><b class="added-dot"></b> Added</span><span><b class="same-dot"></b> Unchanged</span></div>
            <div id="diff-output" class="diff-output" aria-label="Side by side differences" tabindex="-1"></div>
          </div>
        </section>
      </section>
    </main>
    <footer>Text is compared in your browser.</footer>
    <script src="/assets/diff-checker.js"></script>
  </body>
</html>
